<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五子棋 · 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141922; }
  #modeRow { margin-top: 12px; font-size: 12px; color: #9aa4b5; }
  #modeRow select {
    background: #2b3444; color: #e8ecf4; border: none; border-radius: 7px;
    padding: 5px 8px; font-size: 12px; margin-left: 6px; cursor: pointer;
  }
  body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 18px; left: 18px; z-index: 10;
    padding: 14px 16px; min-width: 190px;
    background: rgba(13, 17, 24, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    color: #e8ecf4;
    user-select: none;
  }
  #title { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  #title span { color: #ffb84d; font-weight: 400; }
  #turnRow { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; }
  .stone {
    width: 15px; height: 15px; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 35% 30%, #6a6f78, #0a0c10 75%);
    box-shadow: inset -1px -2px 3px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.5);
  }
  .stone.white { background: radial-gradient(circle at 35% 30%, #ffffff, #b9b4a6 80%); }
  #status { margin-top: 8px; font-size: 13px; color: #9aa4b5; min-height: 17px; }
  #modeRow { margin-top: 12px; font-size: 12px; color: #9aa4b5; }
  #modeRow select {
    background: #2b3444; color: #e8ecf4; border: none; border-radius: 7px;
    padding: 5px 8px; font-size: 12px; margin-left: 6px; cursor: pointer;
  }
  #status.win { color: #ffd166; font-weight: 600; }
  #moves { margin-top: 8px; font-size: 12px; color: #6b7484; }
  #resetBtn {
    margin-top: 12px; width: 100%;
    padding: 8px 0; border: none; border-radius: 9px;
    background: #2b3444; color: #e8ecf4; font-size: 13px; cursor: pointer;
    transition: background .15s;
  }
  #resetBtn:hover { background: #3a465c; }

  #hint {
    position: fixed; right: 18px; bottom: 16px; z-index: 10;
    font-size: 12px; color: rgba(232, 236, 244, 0.4); user-select: none;
  }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<div id="hud">
  <div id="title">五子棋 <span>3D</span></div>
  <div id="turnRow"><i id="stone" class="stone"></i><span id="turnLabel">黑棋行棋</span></div>
  <div id="modeRow">对手<select id="modeSel"><option value="human">人类（双人）</option><option value="ai">AI（你执黑先行）</option></select></div>
  <div id="status"></div>
  <div id="moves">手数 0 / 225</div>
  <button id="resetBtn">新对局</button>
</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 点击交叉点落子</div>
<script type="module" src="./main.js"></script>
</body>
</html>
